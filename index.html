const BANKS = ["OPay", "Moniepoint", "Kuda", "PalmPay", "GTBank", "Guaranty Trust", "Access", "Zenith", "UBA", "First Bank", "FirstBank", "Fidelity", "FCMB", "Sterling", "Wema", "ALAT", "Union Bank", "Stanbic", "Ecobank", "Polaris", "Providus", "Keystone", "Jaiz", "Carbon", "Paystack", "Flutterwave", "Paga", "Fairmoney", "VFD", "Globus", "Titan", "Lotus", "Taj", "Parallex", "Unity Bank", "Heritage", "Standard Chartered", "Citibank", "Moremonee", "Rubies"];

                        
                                                                                          
                                                                                                          
                                                                                                       
                                                                                                    
  

const norm = (s         ) => String(s ?? "").toLowerCase().replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();

// ---------------------------------------------------------------- OCR
// ---------------------------------------------------------------- parsing helpers
const MONTHS = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
const NUM_RE = /(\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?|\d+\.\d{2}|\d{2,})/;
const toNum = (s        ) => Number(s.replace(/,/g, "")) || 0;

function cleanLines(text        ) {
  return text.replace(/\r/g, "").split("\n").map((l) => l.replace(/\t+/g, "  ").replace(/\s{3,}/g, "  ").trim()).filter(Boolean);
}

// Value that follows a label, on the same line or the next one
function valueAfter(lines          , label        , skip         )         {
  for (let i = 0; i < lines.length; i++) {
    const m = lines[i].match(label);
    if (!m || m.index === undefined) continue;
    if (skip && skip.test(lines[i])) continue;
    const rest = lines[i].slice(m.index + m[0].length).replace(/^[\s:.\-–|=]+/, "").trim();
    if (rest.length >= 2) return rest;
    for (let j = i + 1; j < Math.min(lines.length, i + 3); j++) {
      if (lines[j].length >= 2 && !LABEL_ANY.test(lines[j])) return lines[j];
    }
  }
  return "";
}
const LABEL_ANY = /^(amount|transaction|date|time|status|reference|ref|session|narration|remark|description|sender|recipient|beneficiary|bank|account|fee|charge|from|to|type|channel|receipt)\b/i;

function pad(n        ) { return String(n).padStart(2, "0"); }
function validDate(y        , m        , d        ) {
  if (y < 2000 || y > 2100 || m < 1 || m > 12 || d < 1 || d > 31) return null;
  return `${y}-${pad(m)}-${pad(d)}`;
}
function monthIdx(s        ) { const i = MONTHS.indexOf(s.slice(0, 3).toLowerCase()); return i >= 0 ? i + 1 : 0; }
const fixYear = (y        ) => (y < 100 ? 2000 + y : y);

function findDate(text        , defaultYear        )                {
  const tries                                                     = [
    [/\b(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})\b/, (m) => validDate(+m[1], +m[2], +m[3])],
    [/\b(\d{1,2})(?:st|nd|rd|th)?[\s\-,.]+([A-Za-z]{3,9})[\s\-,.]+(\d{2,4})\b/, (m) => monthIdx(m[2]) ? validDate(fixYear(+m[3]), monthIdx(m[2]), +m[1]) : null],
    [/\b([A-Za-z]{3,9})[\s\-.]+(\d{1,2})(?:st|nd|rd|th)?,?[\s\-]+(\d{4})\b/, (m) => monthIdx(m[1]) ? validDate(+m[3], monthIdx(m[1]), +m[2]) : null],
    [/\b(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})\b/, (m) => {
      let d = +m[1], mo = +m[2]; const y = fixYear(+m[3]);
      if (mo > 12 && d <= 12) [d, mo] = [mo, d]; // month-first slip
      return validDate(y, mo, d);
    }],
    [/\b(\d{1,2})(?:st|nd|rd|th)?[\s\-]+([A-Za-z]{3,9})\b/, (m) => monthIdx(m[2]) ? validDate(defaultYear, monthIdx(m[2]), +m[1]) : null],
  ];
  for (const [re, fn] of tries) {
    const m = text.match(re);
    if (m) { const v = fn(m); if (v) return v; }
  }
  return null;
}
function findTime(text        )                {
  const m = text.match(/\b(\d{1,2}):(\d{2})(?::\d{2})?\s*([AaPp][Mm])?\b/);
  if (!m) return null;
  let h = +m[1]; const min = +m[2];
  if (m[3]) { const pm = /p/i.test(m[3]); if (pm && h < 12) h += 12; if (!pm && h === 12) h = 0; }
  if (h > 23 || min > 59) return null;
  return `${pad(h)}:${pad(min)}`;
}

function amountIn(s        ) { const m = s.replace(/\s(?=\d{3}\b)/g, "").match(NUM_RE); return m ? toNum(m[1]) : 0; }

function findAmount(lines          , text        ) {
  // 1) labelled amount
  for (let i = 0; i < lines.length; i++) {
    if (/^\s*(transaction amount|amount paid|amount sent|amount debited|debit amount|total amount|amount|total|sum|grand total)\s*[:\-\t]?\s*(?:₦|NGN|N|#)?\s*[\d,.]*\s*$/i.test(lines[i]) && !/\b(fee|charge|vat|balance|commission|stamp)\b/i.test(lines[i])) {
      const v = amountIn(lines[i].replace(/^.*?(amount|total|sum)/i, "")) || (lines[i + 1] ? amountIn(lines[i + 1]) : 0);
      if (v > 0) return v;
    }
  }
  // 2) first number with a currency mark (OCR often reads ₦ as N, # or H)
  const cur = text.match(/(?:₦|NGN|N|#|H)\s?(\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?|\d+(?:\.\d{2})?)/);
  if (cur) return toNum(cur[1]);
  // 3) largest money-looking number
  const all = [...text.matchAll(/\b(\d{1,3}(?:,\d{3})+(?:\.\d{2})?|\d+\.\d{2})\b/g)].map((m) => toNum(m[1]));
  return all.length ? Math.max(...all) : 0;
}
function findFee(lines          ) {
  for (const l of lines) {
    if (/\b(fee|fees|charge|charges|commission|stamp duty)\b/i.test(l) && !/\bfree\b/i.test(l)) {
      const v = amountIn(l.replace(/^.*?(fee|fees|charge|charges|commission|duty)/i, ""));
      if (v > 0 && v < 100000) return v;
    }
  }
  return 0;
}
function cleanName(s        ) {
  return s.split(/\s*[|•·]\s*|\s{2,}/)[0]
    .replace(/\([^)]*\)/g, "").replace(/\b\d{6,}\b/g, "").replace(/\*{2,}\d*/g, "").replace(/[()]/g, "")
    .replace(/\b(name|account|acct|details?)\b[:\s]*/gi, "").trim().slice(0, 80);
}

// ---------------------------------------------------------------- categorising
function hits(text        , words          ) {
  let n = 0;
  for (const w of words) if (new RegExp(`(^|\\s)${w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}(\\s|$)`).test(text)) n++;
  return n;
}
function categorize(space       , text        , preset         = "general")                                      {
  const t = norm(text);
  let best = "Other", score = 0;
  for (const [cat, words] of Object.entries(KEYWORDS[space === "personal" ? "personal" : (KEYWORDS[preset] ? preset : "general")])) {
    const h = hits(t, words);
    if (h > score) { best = cat; score = h; }
  }
  return { category: best, score };
}
// Words that point clearly to the business
const BUSINESS_SIGNALS                           = {
  general: ["client", "customer", "supplier", "stock", "inventory", "wholesale", "logistics", "salary", "salaries", "staff", "office", "shop", "materials", "waybill", "invoice", "contractor"],
  solar: ["solar", "panel", "panels", "inverter", "inverters", "battery", "batteries", "installer", "installation", "client", "customer", "site", "logistics", "salary", "salaries", "deye", "lithium", "office", "materials", "waybill"],
};
for (const [k, sec] of Object.entries(SECTORS)) BUSINESS_SIGNALS[k] = [...new Set([...BUSINESS_SIGNALS.general, ...sec.signals])];

function guessSpace(text        , preset        , businessName = "")               {
  const t = norm(text);
  const own = norm(businessName).split(" ").filter((w) => w.length > 2);
  if (hits(t, BUSINESS_SIGNALS[preset] ?? BUSINESS_SIGNALS.general) > 0 || (own.length && hits(t, own) > 0)) return "business";
  const p = categorize("personal", t);
  if (p.score > 0 && ["Food & Groceries", "Eating Out", "Family & Support", "Giving & Church", "Shopping & Personal Care", "Health", "Entertainment", "Rent & Housing"].includes(p.category)) return "personal";
  return null;
}

// Which ledger a receipt belongs to, from the account holder's name on it.
// personalName: e.g. "Ada Obi" (every word must appear, any order). businessName: e.g. "Ada Foods".
const NAME_FILLER = new Set(["ltd", "limited", "plc", "nig", "nigeria", "enterprises", "enterprise", "ventures", "global", "services", "the", "and", "co", "company", "concept", "concepts", "innovative", "int", "international"]);
function spaceFromOwner(owner        , personalName        , businessName        )               {
  const o = norm(owner);
  if (!o) return null;
  // Business: its distinctive words must appear (so "Ada Foods" matches "ADA FOODS LIMITED")
  const allBw = norm(businessName).split(" ").filter((w) => w.length > 1);
  const bw = allBw.filter((w) => !NAME_FILLER.has(w)).length ? allBw.filter((w) => !NAME_FILLER.has(w)) : allBw;
  if (bw.length && bw.every((w) => new RegExp(`(^|\\s)${w}`).test(o))) return "business";
  const pn = norm(personalName).split(" ").filter((w) => w.length > 1);
  if (pn.length && pn.every((w) => new RegExp(`(^|\\s)${w}(\\s|$)`).test(o))) return "personal";
  return null;
}

                                                                   
function finish(base                                                                                           , opts            = {})           {
  const preset = opts.preset ?? "general";
  const basis = `${base.narration} ${base.counterparty}`;
  if (base.direction === "credit") {
    // Money from your own business into your pocket (e.g. salary from your company) is personal income
    const fromOwnBiz = !!opts.businessName && spaceFromOwner(base.counterparty, "", opts.businessName) === "business";
    return { ...base, category_personal: incomeCategory(basis, "personal"), category_business: incomeCategory(basis, "business"), likely_space: fromOwnBiz ? "personal" : guessSpace(basis, preset, opts.businessName), confidence: 0.6 };
  }
  const p = categorize("personal", basis), b = categorize("business", basis, preset);
  return { ...base, category_personal: p.category, category_business: b.category, likely_space: guessSpace(basis, preset, opts.businessName), confidence: Math.max(p.score, b.score) > 0 ? 0.7 : 0 };
}

// ---------------------------------------------------------------- main parsers
function parseReceiptText(text        , today        , opts            = {})                  {
  const lines = cleanLines(text);
  const flat = lines.join("\n");
  const amount = findAmount(lines, flat);
  if (!(amount > 0)) return null;

  const dateLine = valueAfter(lines, /\b(transaction date|date\s*(?:&|and)?\s*time|payment date|value date|date)\b/i);
  const date = findDate(dateLine, +today.slice(0, 4)) ?? findDate(flat, +today.slice(0, 4));
  const time = findTime(dateLine) ?? findTime(flat);

  const SENDER = /\b(sender|from account|debit account|originator|paid by)\b/i;
  let counterparty = cleanName(valueAfter(lines,
    /\b(beneficiary(?: name| details| account name)?|recipient(?: name| details| account)?|receiver(?: name)?|credited to|paid to|sent to|transfer to|account name|merchant(?: name)?|biller|to)\b/i, SENDER));
  const credit = /\b(money received|you received|received from|credit alert|incoming transfer|inward transfer|deposit)\b/i.test(flat) && !/\b(beneficiary|recipient)\b/i.test(flat);
  if (credit) counterparty = cleanName(valueAfter(lines, /\b(sender(?: name| details)?|from|received from|originator)\b/i)) || counterparty;

  const ownerName = credit
    ? cleanName(valueAfter(lines, /\b(beneficiary(?: name| details)?|recipient(?: name| details)?|credited to|to account|account name|to)\b/i))
    : cleanName(valueAfter(lines, /\b(sender(?: name| details| account name)?|from account|debit account|account name|originator|paid by|from)\b/i, /\b(beneficiary|recipient|received from)\b/i));

  const narration = valueAfter(lines, /\b(narration|remarks?|description|purpose|payment for|memo|note)\b/i)
    .replace(/^[:\-\s]+/, "").slice(0, 200);

  const refRaw = valueAfter(lines, /\b(session id|transaction (?:reference|ref|id|no\.?|number)|reference(?: no\.?| number| id)?|ref(?:\.|erence)?\s*(?:no\.?|#)?|receipt (?:no\.?|number))\b/i);
  const reference = (refRaw.replace(/\s/g, "").match(/[A-Za-z0-9\-/]{6,}/)?.[0] ?? "").slice(0, 60);

  const bank = BANKS.find((b) => new RegExp(`\\b${b}\\b`, "i").test(flat)) ?? "";

  return finish({
    date: date ?? today, time, amount, fee: findFee(lines), currency: "NGN",
    direction: credit ? "credit" : "debit", counterparty, narration, reference, bank, owner_name: ownerName,
  }, opts);
}

// Typed entries.
// Spending:  "5000 diesel for gen business", "2.5k lunch", "₦12,000 cables for Lekki job"
// Money in:  "+50000 from Mr Adebayo solar balance", "received 150k from Ada Foods salary", "income 20k gift from mum"
function parseManual(text        , today        , opts            = {})                  {
  const lead = text.match(/^\s*(\+|received|recieved|got|income|credit|money in)\s*:?\s*/i);
  const body = lead ? text.slice(lead[0].length) : text;
  const m = body.match(/^\s*(?:₦|n|ngn)?\s*([\d,]+(?:\.\d+)?)\s*(k|m)?\b/i);
  if (!m) return null;
  let amount = toNum(m[1]);
  if (/k/i.test(m[2] ?? "")) amount *= 1000;
  if (/m/i.test(m[2] ?? "")) amount *= 1_000_000;
  if (!(amount > 0)) return null;
  const rest = body.slice(m[0].length);
  const income = !!lead || /\b(paid me|sent me|received from|income from|credited)\b/i.test(rest);
  const ledgerWords = new RegExp(`\\b(personal|biz|business${opts.businessName ? "|" + norm(opts.businessName).split(" ").filter((w) => w.length > 2).join("|") : ""})\\b`, "gi");
  let payee = "", narration = rest;
  if (income) {
    // "from Mr Adebayo for solar balance" -> payer "Mr Adebayo", note "solar balance"
    const f = rest.match(/\bfrom\s+(.+?)(?=\s+(?:for|re|being|as)\b|\s*[-–,]\s|$)/i);
    if (f) {
      payee = f[1].replace(/\s+/g, " ").trim();
      narration = rest.replace(f[0], " ").replace(/^\s*(for|re|being|as)\b/i, "");
      // "Mr Adebayo solar balance": the name is the capitalised part, the rest is what it was for
      const words = payee.split(" ");
      const cut = /^[A-Z]/.test(words[0] ?? "") ? words.findIndex((w, i) => i > 0 && /^[a-z]/.test(w)) : -1;
      if (cut > 0) { narration = words.slice(cut).join(" ") + " " + narration; payee = words.slice(0, cut).join(" "); }
    }
  } else {
    payee = rest.match(/\b(?:to|for)\s+([A-Z][\w.&'-]*(?:\s+[A-Z][\w.&'-]*)*)/)?.[1] ?? "";
  }
  narration = narration.replace(ledgerWords, "").replace(/\b(paid me|sent me|received from|income from|credited)\b/gi, "").replace(/^[\s:,–-]+/, "").replace(/\s+/g, " ").trim().slice(0, 200);
  return finish({ date: today, time: null, amount, fee: 0, currency: "NGN", direction: income ? "credit" : "debit", counterparty: payee.slice(0, 80), narration, reference: "", bank: "", owner_name: "" }, opts);
}

// Bank statement reader: turns the text of a PDF statement into transactions.
// Works on text-based PDFs (what OPay, Moniepoint, Kuda, GTBank, Access etc. email you).
// Needs from receipt.js: findDate, findTime, norm, categorize, BANKS.

const ST_MONEY = /^[-+(]?\s*(?:₦|NGN|N)?\s*\d{1,3}(?:,\d{3})*(?:\.\d{1,2})?\s*\)?\s*(?:CR|DR|Cr|Dr)?$|^[-+(]?\s*(?:₦|NGN|N)?\s*\d+\.\d{2}\s*\)?\s*(?:CR|DR|Cr|Dr)?$/;
const ST_HEAD = {
  date: /^(trans(action)?\.?\s*date|txn\s*date|date|posted?\s*date|post\s*date|value\s*date|trans\.?\s*time|date\s*\/\s*time)$/i,
  desc: /^(description|narration|details|transaction\s*details|remarks?|particulars|narrative|transaction\s*description)$/i,
  debit: /^(debit|debits|withdrawals?|money\s*out|dr|debit\s*\(?₦?\)?|debit\s*amount|outflow|paid\s*out)$/i,
  credit: /^(credit|credits|deposits?|lodgements?|money\s*in|cr|credit\s*\(?₦?\)?|credit\s*amount|inflow|paid\s*in)$/i,
  amount: /^(amount|amount\s*\(?₦?\)?|transaction\s*amount|debit\s*\/\s*credit\s*\(?₦?\)?|dr\s*\/\s*cr)$/i,
  balance: /^(balance|bal|running\s*balance|balance\s*\(?₦?\)?|closing\s*balance|available\s*balance)$/i,
  ref: /^(reference|ref|ref\.?\s*no\.?|transaction\s*ref\w*|session\s*id|cheque\s*no\.?|chq\s*no)$/i,
  value: /^(value\s*date|val\.?\s*date)$/i,
  ignore: /^(channel|branch|teller|type|transaction\s*type|category|status|counterparty\s*bank)$/i,
};
const SKIP_ROW = /\b(opening balance|closing balance|balance b\/?f|balance c\/?f|brought forward|carried forward|total (debit|credit)s?|summary|page \d+ of \d+)\b/i;

function stMoney(s) {
  const neg = /^-|^\(|\bDR\b/i.test(s.trim());
  const v = Number(s.replace(/[^\d.]/g, ""));
  return { v: isFinite(v) ? v : 0, neg, cr: /\bCR\b/i.test(s) };
}

// Group text pieces on a page into lines (same y), then cells (gaps between pieces).
function stLines(items) {
  const rows = [];
  const sorted = items.filter((i) => i.str.trim()).sort((a, b) => b.y - a.y || a.x - b.x);
  for (const it of sorted) {
    const tol = Math.max(2, (it.h || 8) * 0.45);
    let row = rows.find((r) => Math.abs(r.y - it.y) <= tol);
    if (!row) { row = { y: it.y, items: [] }; rows.push(row); }
    row.items.push(it);
  }
  rows.sort((a, b) => b.y - a.y);
  return rows.map((r) => {
    const its = r.items.sort((a, b) => a.x - b.x);
    const cells = [];
    for (const it of its) {
      const last = cells[cells.length - 1];
      const gap = last ? it.x - (last.x1) : 99;
      const moneyStarts = ST_MONEY.test(it.str.trim()) && /[.,]/.test(it.str) && last && !ST_MONEY.test(last.str.trim());
      if (last && !moneyStarts && gap < Math.max(3, (it.h || 8) * 0.6)) { last.str += (gap > 0.8 ? " " : "") + it.str; last.x1 = it.x + it.w; }
      else cells.push({ str: it.str, x: it.x, x1: it.x + it.w });
    }
    cells.forEach((c) => { c.str = c.str.replace(/\s+/g, " ").trim(); c.cx = (c.x + c.x1) / 2; });
    return { y: r.y, cells: cells.filter((c) => c.str) };
  });
}

function stHeader(line) {
  const cols = {};
  for (const c of line.cells) {
    const t = c.str.replace(/\s*[\(\[]\s*(₦|n|ngn|naira)\s*[\)\]]\s*$/i, "").replace(/\s*:$/, "").trim();
    for (const [k, re] of Object.entries(ST_HEAD)) {
      if (re.test(t)) { if (!(k in cols)) cols[k] = c; break; }
    }
  }
  if (cols.value && !cols.date) { cols.date = cols.value; delete cols.value; }
  const hasMoney = (cols.debit && cols.credit) || cols.amount;
  return cols.date && hasMoney ? cols : null;
}

function stNearest(cols, cell, keys) {
  let best = null, d = Infinity;
  for (const k of keys) {
    if (!cols[k]) continue;
    const c = cols[k];
    // right-aligned numbers: compare right edges, fall back to centres
    const dist = Math.min(Math.abs(c.x1 - cell.x1), Math.abs(c.cx - cell.cx));
    if (dist < d) { d = dist; best = k; }
  }
  return best;
}

function stNearestLeft(cols, cell, keys) {
  let best = null, bx = -Infinity;
  for (const k of keys) { const c = cols[k]; if (!c) continue; if (c.x <= cell.x + 6 && c.x > bx) { bx = c.x; best = k; } }
  return best || stNearest(cols, cell, keys);
}

function stCounterparty(desc) {
  const d = desc.replace(/\s+/g, " ").trim();
  const pats = [
    /\bto\b\s*:?\s*([A-Za-z][A-Za-z .'&*-]{2,60}?)(?=\s*(?:\/|\||-{1,2}\s|\bref\b|\bfrom\b|\bvia\b|\d{6,}|$))/i,
    /\b(?:from|frm)\b\s*:?\s*([A-Za-z][A-Za-z .'&*-]{2,60}?)(?=\s*(?:\/|\||-{1,2}\s|\bref\b|\bto\b|\bvia\b|\d{6,}|$))/i,
    /\b(?:pos\s+purchase|pos|purchase|payment)\b\s*(?:\b(?:at|to)\b|@)?\s*:?\s*([A-Za-z][A-Za-z .'&*-]{2,60}?)(?=\s*(?:\/|\||-{1,2}\s|\d{4,}|$))/i,
  ];
  for (const p of pats) { const m = d.match(p); if (m && m[1].trim().length > 2) return m[1].replace(/\b(transfer|trf|nip|ref|via)\b.*$/i, "").trim().slice(0, 60); }
  const seg = d.split(/[\/|]/).map((s) => s.trim()).find((s) => /[A-Za-z]{3,}/.test(s) && !/^(nip|trf|transfer|pos|web|ussd|mob|ft|inward|outward)$/i.test(s));
  return (seg || d).replace(/\d{6,}/g, "").trim().slice(0, 60);
}

const CHARGE_RE = /\b(charge|charges|fee|fees|vat|sms alert|stamp duty|levy|commission|maintenance fee|card maintenance|emtl)\b/i;

// pages: [[{str,x,y,w,h}]], returns { rows: [...], bank, warnings: [] }
function parseStatementPages(pages, fullText, defaultYear, preset) {
  const out = [], warnings = [];
  let cols = null, cur = null, prevBal = null;
  const push = () => { if (cur) { out.push(cur); cur = null; } };
  for (const items of pages) {
    const lines = stLines(items);
    for (const line of lines) {
      const h = stHeader(line);
      if (h) { push(); cols = h; continue; }
      if (!line.cells.length) continue;
      const joined = line.cells.map((c) => c.str).join("  ");
      if (SKIP_ROW.test(joined)) { push(); const nums = line.cells.filter((c) => ST_MONEY.test(c.str)); if (nums.length) prevBal = stMoney(nums[nums.length - 1].str).v; continue; }

      // A new transaction starts with a date in the first cell or two
      const lead = line.cells.slice(0, 2).map((c) => c.str).join(" ");
      const date = findDate(lead, defaultYear);
      const moneyCells = line.cells.filter((c) => ST_MONEY.test(c.str) && /[.,]/.test(c.str));
      if (date && moneyCells.length) {
        push();
        let debit = 0, credit = 0, balance = null, amount = 0, amtNeg = false, amtCr = false;
        if (cols) {
          for (const c of moneyCells) {
            const k = stNearest(cols, c, ["debit", "credit", "amount", "balance"]);
            const m = stMoney(c.str);
            if (k === "debit") debit = m.v; else if (k === "credit") credit = m.v;
            else if (k === "balance") balance = m.v; else if (k === "amount") { amount = m.v; amtNeg = m.neg; amtCr = m.cr; }
          }
        } else {
          // No header seen: last number is the balance, the one before is the amount
          if (moneyCells.length >= 2) { balance = stMoney(moneyCells[moneyCells.length - 1].str).v; const m = stMoney(moneyCells[moneyCells.length - 2].str); amount = m.v; amtNeg = m.neg; amtCr = m.cr; }
          else { const m = stMoney(moneyCells[0].str); amount = m.v; amtNeg = m.neg; amtCr = m.cr; }
        }
        let direction = null, value = 0;
        if (debit > 0) { direction = "debit"; value = debit; }
        else if (credit > 0) { direction = "credit"; value = credit; }
        else if (amount > 0) {
          value = amount;
          if (amtNeg) direction = "debit"; else if (amtCr) direction = "credit";
          else if (balance != null && prevBal != null) direction = balance < prevBal ? "debit" : "credit";
          else direction = /\b(cr|credit|received|deposit|inflow|from)\b/i.test(joined) ? "credit" : "debit";
        }
        if (balance != null) prevBal = balance;
        if (!(value > 0)) continue;
        const others = line.cells.filter((c) => !moneyCells.includes(c));
        const kinds = ["date", "value", "desc", "ref", "ignore", "debit", "credit", "amount", "balance"];
        const colOf = (c) => (cols && cols.desc ? stNearestLeft(cols, c, kinds) : null);
        const descCells = others.filter((c) => colOf(c) ? colOf(c) === "desc" : !findDate(c.str, defaultYear) && !findTime(c.str));
        const refCell = others.find((c) => colOf(c) === "ref");
        cur = { date, time: findTime(lead), direction, amount: value, desc: descCells.map((c) => c.str).join(" "), reference: refCell ? refCell.str.replace(/\s/g, "").slice(0, 60) : "" };
        continue;
      }
      // Continuation of the previous transaction's description
      if (cur && !moneyCells.length && joined.length < 160) {
        const extra = line.cells.filter((c) => !findDate(c.str, defaultYear)).map((c) => c.str).join(" ");
        const descOnly = cols && cols.desc ? line.cells.filter((c) => stNearestLeft(cols, c, ["date", "value", "desc", "ref", "ignore", "debit", "credit", "amount", "balance"]) === "desc").map((c) => c.str).join(" ") : extra;
        if (descOnly && !/^(page|printed|generated|statement|account (name|number)|currency)\b/i.test(descOnly)) cur.desc = (cur.desc + " / " + descOnly).trim();
      } else if (!moneyCells.length) push();
    }
  }
  push();
  if (!out.length) warnings.push("No transactions found. If this is a scanned statement (a picture, not text), send the screenshots instead.");
  const bank = (typeof BANKS !== "undefined" ? BANKS : []).find((b) => new RegExp(`\\b${b}\\b`, "i").test(fullText)) || "";
  const rows = out.map((t) => {
    const desc = t.desc.replace(/\s+/g, " ").trim().slice(0, 200);
    const counterparty = stCounterparty(desc);
    const charge = CHARGE_RE.test(desc) && t.direction === "debit" && t.amount <= 5000;
    const p = categorize("personal", desc + " " + counterparty), e = categorize("business", desc + " " + counterparty, preset || "general");
    return {
      date: t.date, time: t.time, amount: t.amount, fee: 0, currency: "NGN", direction: t.direction,
      counterparty, narration: desc, reference: t.reference, bank,
      category_personal: t.direction === "credit" ? incomeCategory(desc + " " + counterparty, "personal") : charge ? "Bank Charges" : p.category,
      category_business: t.direction === "credit" ? incomeCategory(desc + " " + counterparty, "business") : charge ? "Bank Charges" : e.category,
      likely_space: null, confidence: Math.max(p.score, e.score) > 0 ? 0.6 : 0, owner_name: "",
    };
  });
  return { rows, bank, warnings };
}

// Read a PDF with pdf.js into positioned text pieces. Throws {password:true} when locked.
async function readPdf(pdfjs, data, password) {
  let doc;
  try { doc = await pdfjs.getDocument({ data, password: password || undefined, isEvalSupported: false }).promise; }
  catch (e) { if (e && (e.name === "PasswordException" || /password/i.test(e.message))) { const err = new Error("password"); err.password = true; err.wrong = !!password; throw err; } throw e; }
  const pages = []; let text = "";
  for (let p = 1; p <= doc.numPages; p++) {
    const page = await doc.getPage(p);
    const tc = await page.getTextContent();
    const items = tc.items.filter((i) => "str" in i).map((i) => ({ str: i.str, x: i.transform[4], y: i.transform[5], w: i.width, h: Math.abs(i.transform[3]) || i.height || 8 }));
    pages.push(items); text += items.map((i) => i.str).join(" ") + "\n";
  }
  return { pages, text, numPages: doc.numPages };
}

return { parseReceiptText, parseManual, spaceFromOwner, categorize, categoriesFor, listFor, incomeCategory, INCOME_CATEGORIES, PERSONAL_CATEGORIES, BUSINESS_CATEGORIES, BUSINESS_KINDS, norm, parseStatementPages, readPdf };

/* ============ theme: follows the phone (Auto) unless the person picks White or Night ============ */

function applyTheme() {
  const a = getAppearance();
  const t = a === "auto" ? (darkQuery && darkQuery.matches ? "dark" : "light") : a;
  document.documentElement.dataset.theme = t;
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = t === "light" ? "#E8EBE6" : "#060708";

}

applyTheme();

  const onChange = () => { if (getAppearance() === "auto") { applyTheme(); if (typeof render === "function" && $("app") && !$("app").classList.contains("hidden")) render(); } };

/* ============ data ============ */
let demoKeep = null;
async function load() {
  if (demo) {
    // The preview keeps its records for the visit, and picks up what the sample business adds (Got paid, vendor payments)
    if (!demoKeep) { demoKeep = demoRows(); budgets = demoBudgets(); }
    const extra = (window.MockEgom && window.MockEgom.db.expenses) || [];
    for (let i = demoKeep.length - 1; i >= 0; i--) if (demoKeep[i]._mock && !extra.some((m) => m.id === demoKeep[i].id)) demoKeep.splice(i, 1);
    extra.forEach((m) => { const have = demoKeep.find((r) => r.id === m.id); if (have) Object.assign(have, m); else demoKeep.push({ ...m, _mock: true }); });
    rows = demoKeep; return render();
  }
  const [{ data, error }, b] = await Promise.all([
    sb.from("expenses").select("*").eq("status", "saved").order("tx_date", { ascending: false }).limit(5000),
    sb.from("budgets").select("*"),
  ]);
  if (error) { banner("Couldn't load your expenses: " + error.message); rows = []; } else rows = data || [];
  budgets = {}; (b.data || []).forEach((x) => { budgets[x.space + "|" + x.category] = Number(x.monthly_limit) || 0; });
  render();
}
async function updateRow(id, patch) {
  const r = rows.find((x) => x.id === id); if (!r) return;
  Object.assign(r, patch); render();
  if (demo) return toast("Preview only — not saved");
  const { error } = await sb.from("expenses").update({ ...patch, updated_at: new Date().toISOString() }).eq("id", id);
  if (error) return toast("Couldn't save: " + error.message);
  if (patch.category && r.space && normKey(r.counterparty).length >= 3) await sb.from("category_rules").upsert({ space: r.space, counterparty_key: normKey(r.counterparty), category: patch.category, updated_at: new Date().toISOString() });
  toast("Saved");
}
async function deleteRow(id) {
  rows = rows.filter((x) => x.id !== id); render();
  if (demo) return toast("Preview only — not deleted");
  const { error } = await sb.from("expenses").delete().eq("id", id);
  toast(error ? "Couldn't delete: " + error.message : "Deleted");
}
let budgetTimer = {};
function setBudget(space, category, limit) {
  const k = space + "|" + category;
  if (limit > 0) budgets[k] = limit; else delete budgets[k];
  if (demo) return;
  clearTimeout(budgetTimer[k]);
  budgetTimer[k] = setTimeout(async () => {
    const { error } = limit > 0
      ? await sb.from("budgets").upsert({ space, category, monthly_limit: limit, updated_at: new Date().toISOString() })
      : await sb.from("budgets").delete().eq("space", space).eq("category", category);
    toast(error ? "Couldn't save budget: " + error.message : "Budget saved");
  }, 700);
}

/* ============ Egom Business (business.js): invoices, quotes, customers, reports ============ */
const BIZ_VERSION = "15";   // raise with every business.js update so phones fetch the new copy
let bizLoading = null;
function loadBusiness() {
  if (window.EgomBusiness) return Promise.resolve(window.EgomBusiness);
  if (!bizLoading) bizLoading = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "business.js?v=" + BIZ_VERSION;
    s.onload = () => window.EgomBusiness ? res(window.EgomBusiness) : rej(new Error("Couldn't open Business."));
    s.onerror = () => { bizLoading = null; s.remove(); rej(new Error("Couldn't open Business. Check your connection and try again.")); };
    document.head.appendChild(s);

}
// What business.js borrows from the main app
function shareEgom() {
  if (window.EGOM && window.EGOM._egom) return;
  window.EGOM = {
    _egom: true,
    get sb() { return sb || (demo && window.MockEgom ? window.MockEgom.sb : null); },
    get ym() { return ym; },
    get preview() { return !!demo; },
    toast, icon,
    reload: () => load(),
    openAdd: () => openAdd(),
    accountNames: () => accountNames(),
    renderExpenses: () => renderTx(),
    renderBanks: () => renderAccounts(),
    heroSpark: () => profitSpark(),
    categories: () => CATEGORIES.business,
    // Money in and out for a month, from Egom's own records (receipts, WhatsApp, payments recorded with Got paid, vendor payments)
    monthIO: (v) => { const cur = monthRows(v || ym); return { in: sum(incomes(cur), (r) => Number(r.amount) || 0), out: sum(expenses(cur)) }; },
    topSpend: (n) => [...catTotals(expenses(monthRows(ym))).entries()].sort((a, b) => b[1] - a[1]).slice(0, n || 4).map(([c, v]) => ({ name: c, naira: v, color: colorOf(c), icon: catIcon(c) })),
    recentHTML: (n) => { const list = rows.filter((r) => inLedger(r) && r.kind !== "transfer").sort((a, b) => (b.tx_date || "").localeCompare(a.tx_date || "") || (b.created_at || "").localeCompare(a.created_at || "")).slice(0, n || 6);
      return list.map((r) => txRow(r).replace('<small>' + esc((r.tx_time || "").slice(0, 5)) + '</small>', '<small>' + esc(prettyDay(r.tx_date)) + '</small>')).join(""); },
    openTx: (id) => openTx(id),
    bankSummary: () => {
      const names = accountNames(), known = names.map((n) => [n, accountBalance(n)]).filter(([, v]) => v !== null);
      const isCash = (n) => /cash/i.test(n);
      const sum = (f) => known.filter(([n]) => f(n)).reduce((t, [, v]) => t + v, 0);
      return { names: names.length, known: known.length, total: sum(() => true), cash: sum(isCash), bank: sum((n) => !isCash(n)) };
    },
    shareBase: location.origin + "/",
  };
}
function banner(t) { $("banner").textContent = t; $("banner").classList.remove("hidden"); }
function catTotals(list) {
  const m = new Map(); list.forEach((r) => m.set(r.category || "Other", (m.get(r.category || "Other") || 0) + spend(r)));
  return m;
}
function ledgerCats() { return ledger === "all" ? (hasBiz() ? [...new Set([...CATEGORIES.business, ...CATEGORIES.personal])] : CATEGORIES.personal) : CATEGORIES[ledger]; }
function budgetFor(cat) {
  if (ledger !== "all") return budgets[ledger + "|" + cat] || 0;
  return (budgets["personal|" + cat] || 0) + (budgets["business|" + cat] || 0);

const tint = (c, dark) => `color-mix(in srgb, ${c} ${dark ? 24 : 14}%, var(--bg))`;
const isDark = () => (document.documentElement.dataset.theme || "light") === "dark";
function ring(pct, col, size = 34) {
  const r = size / 2 - 4, C = 2 * Math.PI * r, over = pct > 100;
  return `<svg class="ring2" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" style="stroke:var(--track)" stroke-width="4"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" style="stroke:${over ? "var(--exp)" : col}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C * Math.min(100, pct) / 100} ${C}" transform="rotate(-90 ${size / 2} ${size / 2})"/></svg>`;
}
// Business hero: profit building up through the month (money in minus money out, day by day)
function profitSpark() {
  const [y, m] = ym.split("-").map(Number), days = new Date(y, m, 0).getDate();
  const cur = monthRows(ym), v = Array(days).fill(0);
  incomes(cur).forEach((r) => { v[+r.tx_date.slice(8, 10) - 1] += Number(r.amount) || 0; });
  expenses(cur).forEach((r) => { v[+r.tx_date.slice(8, 10) - 1] -= spend(r); });
  if (!v.some(Boolean)) return "";
  let acc = 0; const cum = v.map((x) => (acc += x));
  const last = ym === ymNow() ? now.getDate() : days, shown = cum.slice(0, last);
  const hi = Math.max(0, ...shown), lo = Math.min(0, ...shown), span = Math.max(1, hi - lo);
  const Y = (c) => 66 - ((c - lo) / span) * 60, X = (i) => (i / (days - 1)) * 200;
  const pts = shown.map((c, i) => `${X(i)},${Y(c)}`).join(" ");
  const zero = lo < 0 ? `<line x1="0" x2="200" y1="${Y(0)}" y2="${Y(0)}" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>` : "";
  return `<svg viewBox="0 0 200 70" preserveAspectRatio="none" aria-hidden="true">${zero}<polyline points="${pts}" fill="none" style="stroke:var(--chart)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
}
function sparkline(exp) {
  const [y, m] = ym.split("-").map(Number), days = new Date(y, m, 0).getDate();
  const v = Array(days).fill(0); exp.forEach((r) => { v[+r.tx_date.slice(8, 10) - 1] += spend(r); });
  let acc = 0; const cum = v.map((x) => (acc += x)); const max = Math.max(1, acc);
  const last = ym === ymNow() ? now.getDate() : days;
  const pts = cum.slice(0, last).map((c, i) => `${(i / (days - 1)) * 200},${66 - (c / max) * 60}`).join(" ");
  return `<svg viewBox="0 0 200 70" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" style="stroke:var(--chart)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
}

function bigRing(pct, size, track, stroke, label, textCol) {

    // Only a still finger counts: any movement, scroll or cancel stops it, so scrolling never opens the sheet.
    let t = null, x0 = 0, y0 = 0;
    const stop = () => { if (t) { clearTimeout(t); t = null; } };
    const start = (e) => { stop(); x0 = e.clientX; y0 = e.clientY; t = setTimeout(() => { t = null; swallowNextClick(); openWidget(b.dataset.cat, tileCats); }, 600); };
    b.addEventListener("pointerdown", start);
    b.addEventListener("pointermove", (e) => { if (Math.abs(e.clientX - x0) > 8 || Math.abs(e.clientY - y0) > 8) stop(); });
    ["pointerup", "pointerleave", "pointercancel", "touchmove", "touchend", "touchcancel"].forEach((ev) => b.addEventListener(ev, stop, { passive: true }));
    window.addEventListener("scroll", stop, { passive: true });
    b.addEventListener("contextmenu", (e) => e.preventDefault());
  });
}

function swallowNextClick() {
  const h = (e) => { e.stopPropagation(); e.preventDefault(); done(); };
  const done = () => { document.removeEventListener("click", h, true); clearTimeout(tm); };
  document.addEventListener("click", h, true); const tm = setTimeout(done, 1500);
}

// Save the list; move existing transactions, budgets and learned rules from old names to new ones
async function saveCategories(sp, list, icons, moves, catColors) {
  const hp = homePrefs();
  const cat_map = { ...(hp.cat_map || {}) }; const m = { ...(cat_map[sp] || {}) };
  for (const [from, to] of Object.entries(moves)) {
    Object.keys(m).forEach((k) => { if (m[k] === from) m[k] = to; });
    m[from] = to;
    if (!demo) {
      const now = new Date().toISOString();
      const a = await sb.from("expenses").update({ category: to, updated_at: now }).eq("space", sp).eq("category", from);
      if (a.error) return a.error.message;
      await sb.from("category_rules").update({ category: to, updated_at: now }).eq("space", sp).eq("category", from);
      const lim = budgets[sp + "|" + from];
      if (lim) { await sb.from("budgets").delete().eq("space", sp).eq("category", from); if (to !== "Other" || !budgets[sp + "|Other"]) await sb.from("budgets").upsert({ space: sp, category: to, monthly_limit: lim, updated_at: now }); }
    }
    rows.forEach((r) => { if (r.space === sp && r.category === from) r.category = to; });
    if (budgets[sp + "|" + from]) { if (!budgets[sp + "|" + to]) budgets[sp + "|" + to] = budgets[sp + "|" + from]; delete budgets[sp + "|" + from]; }
  }
  cat_map[sp] = m;
  // keep pinned widgets and widget colours pointing at the new names
  const widgets = { ...(hp.widgets || {}) }, colors = { ...(hp.colors || {}) };
  for (const key of Object.keys(widgets)) if (Array.isArray(widgets[key])) widgets[key] = [...new Set(widgets[key].map((c) => moves[c] && moves[c] !== "Other" ? moves[c] : c).filter((c) => !moves[c] || moves[c] !== "Other"))];
  for (const [from, to] of Object.entries(moves)) for (const k of Object.keys(colors)) if (k.endsWith("|" + from)) { if (to !== "Other") colors[k.replace(/\|.*$/, "|" + to)] = colors[k]; delete colors[k]; }
  await saveHomePrefs({ ...hp, cats: { ...(hp.cats || {}), [sp]: list }, cat_map, cat_icons: icons, cat_colors: catColors || hp.cat_colors || {}, widgets, colors });
  return null;
}

function recordView(cur, exp, inc) {
  const extras = calExtras(), dueOn = {};
  extras.forEach((x) => { const d = +x.date.slice(8, 10); (dueOn[d] = dueOn[d] || []).push(x); });
  const [y, m] = ym.split("-").map(Number);
  const first = new Date(y, m - 1, 1), days = new Date(y, m, 0).getDate();
  const lead = (first.getDay() + 6) % 7; // Monday first
  const perDay = {}; exp.forEach((r) => { const d = +r.tx_date.slice(8, 10); perDay[d] = (perDay[d] || 0) + spend(r); });
  const maxDay = Math.max(1, ...Object.values(perDay));
  let cells = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map((d) => `<div class="dow">${d}</div>`).join("");
  const prevDays = new Date(y, m - 1, 0).getDate();
  for (let i = 0; i < lead; i++) cells += `<div class="d out"><span class="n">${prevDays - lead + 1 + i}</span></div>`;
  for (let d = 1; d <= days; d++) {
    const isToday = ym === ymNow() && d === now.getDate();
    const heat = perDay[d] ? 0.1 + 0.45 * Math.sqrt(perDay[d] / maxDay) : 0;
    cells += `<button class="d ${isToday ? "today" : ""} ${selDay === d ? "sel" : ""}" data-d="${d}" style="${heat ? `background:color-mix(in srgb, var(--chart) ${Math.round(heat * 30)}%, transparent)` : ""}"><span class="n">${d}</span><span class="a">${perDay[d] ? short(perDay[d]) : ""}</span>${dueOn[d] ? `<i class="duedot ${dueOn[d].some((x) => x.late) ? "late" : ""}" title="Something due"></i>` : ""}</button>`;
  }
  const tail = (7 - ((lead + days) % 7)) % 7;
  for (let i = 1; i <= tail; i++) cells += `<div class="d out"><span class="n">${i}</span></div>`;
  const te = sum(exp), ti = sum(inc, (r) => Number(r.amount));
  let list = cur.slice();
  if (selDay) list = list.filter((r) => +r.tx_date.slice(8, 10) === selDay);
  if (catFilter) list = list.filter((r) => r.category === catFilter);
  const byDay = new Map();
  const dueList = catFilter ? [] : extras.filter((x) => !selDay || +x.date.slice(8, 10) === selDay);
  dueList.forEach((x) => { if (!byDay.has(x.date)) byDay.set(x.date, []); });
  list.sort((a, b) => (b.tx_date + (b.tx_time || "")).localeCompare(a.tx_date + (a.tx_time || ""))).forEach((r) => { if (!byDay.has(r.tx_date)) byDay.set(r.tx_date, []); byDay.get(r.tx_date).push(r); });
  const groups = [...byDay.entries()].sort((a, b) => b[0].localeCompare(a[0])).map(([d, rs]) => {
    const [yy, mm, dd] = d.split("-").map(Number);
    const lbl = new Date(yy, mm - 1, dd).toLocaleDateString("en-GB", { weekday: "short", day: "2-digit", month: "short" });
    const out = sum(expenses(rs));
    const due = dueList.filter((x) => x.date === d);
    return `<div class="day"><div class="hd"><span>${lbl}</span><span>${out ? `<em>OUT</em>${money(out)}` : ""}</span></div>${due.map(dueRow).join("")}${rs.map(txRow).join("")}</div>`;
  }).join("");
  const filterNote = (selDay || catFilter) ? `<div style="display:flex;justify-content:space-between;align-items:center;margin:4px 2px 10px;font-size:13px;color:var(--ink-2)"><span>Showing ${[catFilter, selDay && selDay + " " + monthTitle(ym)].filter(Boolean).map(esc).join(" · ")}</span><button class="btn" id="clearF" style="padding:6px 12px">Show all</button></div>` : "";
  return `<div class="txcols"><div class="txside"><div class="card"><div class="cal">${cells}</div>

function donut(segs, total) {

function wireStats(exp) {

  const v = Array(days).fill(0); exp.forEach((r) => { v[+r.tx_date.slice(8, 10) - 1] += spend(r); });
  const W = el.clientWidth || 340, H = 190, pl = 40, pr = 10, pt = 10, pb = 24, iw = W - pl - pr, ih = H - pt - pb;
  const max = Math.max(1, ...v), stepv = niceStep(max / 4), top = Math.ceil(max / stepv) * stepv;

// Step 1: email only. People who set a password get asked for it; everyone else (including new people) gets a code.
function screenEmail() {
  showAuth(`
    <h1 class="hero-h">Your money, organised.</h1>
    <p class="hero-p">Sign in or create your free account. Just start with your email.</p>
    <form id="emailForm" class="auth-form">
      <label for="emailIn">Your email</label>
      <input id="emailIn" type="email" inputmode="email" autocomplete="username email" placeholder="you@example.com" required value="${esc(authEmail)}" autofocus>
      <button class="btn primary big" id="emailGo" type="submit">Continue</button>
      <div id="authErr" class="auth-err hidden"></div>
      <p class="fine" style="margin-top:6px">By continuing you agree to how we handle your information in our <a href="privacy.html" target="_blank" rel="noopener">Privacy policy</a>.</p>
    </form>
    ${demo ? `<p class="fine" style="text-align:center"><a href="#" id="demoSkip">Skip to the sample dashboard</a></p>` : ""}`);
  $("emailForm").onsubmit = async (e) => {
    e.preventDefault();
    authEmail = $("emailIn").value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(authEmail)) return authErr("That email doesn't look right.");
    busy($("emailGo"), true, "One moment…");
    const how = await signInMethod();
    if (how === "password") return screenPassword();
    afterCodeSetPassword = false;
    const err = await sendCode();
    if (err) { busy($("emailGo"), false, "Continue"); return authErr(err); }
    screenCode();
  };
  if ($("demoSkip")) $("demoSkip").onclick = (e) => { e.preventDefault(); profile = { ...DEMO_PROFILE }; enterApp(); };
}
async function signInMethod() {
  if (demo) return /ada@|pass/.test(authEmail) ? "password" : "code";
  try {
    const { data, error } = await sb.rpc("egom_sign_in_method", { p_email: authEmail });
    if (error) return "unknown";
    return data === "password" ? "password" : "code";
  } catch (e) { return "unknown"; }
}
// Step 2 for people with a password (or when Egom couldn't tell): password, or a code instead
function screenPassword() {
  showAuth(`
    <button type="button" class="linkbtn auth-back" id="pwBack">‹ Back</button>
    <h2 class="hero-h" style="font-size:28px">Welcome back</h2>
    <p class="hero-p">${esc(authEmail)} · <button type="button" class="linkbtn" id="pwChange">Not you?</button></p>
    <form id="pwForm" class="auth-form">
      <input type="email" autocomplete="username" value="${esc(authEmail)}" hidden readonly>
      <label for="pwIn">Password</label>
      <div class="pw-wrap"><input id="pwIn" type="password" autocomplete="current-password" placeholder="Your password" required><button type="button" class="pw-eye" id="pwEye" aria-label="Show password">Show</button></div>
      <button class="btn primary big" id="pwGo" type="submit">Sign in</button>
      <div id="authErr" class="auth-err hidden"></div>
      <div class="or-row"><span>or</span></div>
      <button class="btn big" id="codeGo" type="button">Email me a code instead</button>
      <p class="fine"><button type="button" class="linkbtn" id="forgotPw">Forgot password?</button></p>
    </form>`);
  setTimeout(() => $("pwIn") && $("pwIn").focus(), 50);
  $("pwBack").onclick = screenEmail; $("pwChange").onclick = screenEmail;
  $("pwEye").onclick = () => { const i = $("pwIn"), show = i.type === "password"; i.type = show ? "text" : "password"; $("pwEye").textContent = show ? "Hide" : "Show"; };
  $("pwForm").onsubmit = async (e) => {
    e.preventDefault();
    const password = $("pwIn").value;
    if (!password) { authErr("Type your password, or tap Email me a code instead."); return $("pwIn").focus(); }
    busy($("pwGo"), true, "Signing in…");
    const err = await signInPassword(password);
    if (err) { busy($("pwGo"), false, "Sign in"); return authErr(err); }
    await continueSignIn();
  };
  const codeFlow = async (forgot) => {
    afterCodeSetPassword = forgot;
    busy($("codeGo"), true, "Sending code…");
    const err = await sendCode();
    if (err) { busy($("codeGo"), false, "Email me a code instead"); return authErr(err); }
    screenCode();
  };
  $("codeGo").onclick = () => codeFlow(false);
  $("forgotPw").onclick = () => codeFlow(true);
}
async function signInPassword(password) {
  if (demo) {
    if (password !== "egom-demo-1") return "That email and password don't match. Forgot it? Tap Forgot password.";
    profile = { ...DEMO_PROFILE, email: authEmail }; return null;
  }
  const { data, error } = await sb.auth.signInWithPassword({ email: authEmail, password });
  if (error) {
    if (/rate|too many/i.test(error.message)) return "Too many tries just now. Wait a minute and try again.";
    if (/not confirmed/i.test(error.message)) return "Confirm your email first: tap Email me a code instead.";
    return "That password isn't right. Try again, or tap Email me a code instead.";
  }
  session = data.session;
  return null;
}
async function sendCode() {
  if (demo) { resendAt = Date.now() + 45000; return null; }
  const { error } = await sb.auth.signInWithOtp({ email: authEmail, options: { shouldCreateUser: true, emailRedirectTo: location.origin + location.pathname } });
  if (error) {
    if (/rate|limit|too many|security purposes/i.test(error.message)) return "Too many codes sent just now. Wait a minute and try again.";
    return "Couldn't send the code. Try again in a minute, or sign in with your password.";
  }
  resendAt = Date.now() + 45000;
  return null;
}

// ---- Two-step: the code from an authenticator app ----------------------------------------
async function needsSecondStep() {
  if (demo) return !!demoMfa.on && !demoMfa.passed;
  try {
    const { data } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
    return data && data.currentLevel === "aal1" && data.nextLevel === "aal2";
  } catch { return false; }
}
async function continueSignIn() {
  if (await needsSecondStep()) return screenMfa();
  await afterSignIn();
  if (afterCodeSetPassword) { afterCodeSetPassword = false; usedCode = false; openSecurity("password"); }
}
function screenMfa() {
  showAuth(`
    <h2 class="step-h">Two-step verification</h2>
    <p class="step-p">Open your authenticator app (Google Authenticator, Microsoft Authenticator, 1Password…) and type the 6-digit code for <b>Egom</b>.</p>
    <form id="mfaForm" class="auth-form">
      <input id="mfaIn" class="code-in" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="••••••" required>
      <button class="btn primary big" id="mfaGo" type="submit">Verify</button>
      <div id="authErr" class="auth-err hidden"></div>
    </form>
    <p class="fine center">Lost your phone? Email <a href="mailto:support@egom.ng">support@egom.ng</a> from this email address and we'll help you back in.</p>
    <p class="fine center"><button class="linkbtn" id="mfaOut">Use a different account</button></p>`);
  const inp = $("mfaIn"); inp.focus();
  inp.oninput = () => { inp.value = inp.value.replace(/\D/g, "").slice(0, 6); if (inp.value.length === 6) $("mfaForm").requestSubmit(); };
  $("mfaForm").onsubmit = async (e) => {
    e.preventDefault();
    const code = inp.value.trim();
    if (!/^\d{6}$/.test(code)) return authErr("Enter all 6 digits.");
    busy($("mfaGo"), true, "Checking…");
    const err = await verifyMfa(code);
    if (err) { busy($("mfaGo"), false, "Verify"); inp.value = ""; return authErr(err); }
    await afterSignIn();
    if (afterCodeSetPassword) { afterCodeSetPassword = false; openSecurity("password"); }
  };
  $("mfaOut").onclick = async () => { if (!demo) await sb.auth.signOut(); session = null; profile = null; demoMfa.passed = false; screenEmail(); };
}
async function verifyMfa(code) {
  if (demo) { if (code !== "135790") return "That code isn't right. Codes change every 30 seconds, so use the newest one."; demoMfa.passed = true; return null; }
  const { data: f } = await sb.auth.mfa.listFactors();
  const factor = (f?.totp || []).find((x) => x.status === "verified");
  if (!factor) return "No authenticator is set up for this account.";
  const { error } = await sb.auth.mfa.challengeAndVerify({ factorId: factor.id, code });
  if (error) return "That code isn't right. Codes change every 30 seconds, so use the newest one.";
  const { data: s } = await sb.auth.getSession(); session = s.session || session;
  return null;
}
const demoMfa = { on: false, passed: false };

// ---- 2. Code ---------------------------------------------------------------------
function screenCode() {
  showAuth(`
    <button class="linkbtn back" id="backEmail">‹ Back</button>
    <h2 class="step-h">Check your email</h2>
    <p class="step-p">We sent a 6-digit code to <b>${esc(authEmail)}</b>. Type it here, or tap the button in the email. It can take a minute, and sometimes lands in spam.</p>
    <form id="codeForm" class="auth-form">
      <input id="codeIn" class="code-in" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="••••••" required>
      <button class="btn primary big" id="codeGo" type="submit">Verify</button>
      <div id="authErr" class="auth-err hidden"></div>
    </form>
    <p class="fine center"><button class="linkbtn" id="resend" disabled>Resend email</button></p>
    ${demo ? `<p class="fine center">Preview: any 6 digits work.</p>` : ""}`);
  $("backEmail").onclick = screenEmail;
  const inp = $("codeIn"); inp.focus();
  inp.oninput = () => { inp.value = inp.value.replace(/\D/g, "").slice(0, 6); if (inp.value.length === 6) $("codeForm").requestSubmit(); };
  $("codeForm").onsubmit = async (e) => {
    e.preventDefault();
    const token = inp.value.trim();
    if (!/^\d{6}$/.test(token)) return authErr("Enter all 6 digits.");
    busy($("codeGo"), true, "Checking…");
    usedCode = true;
    if (demo) { profile = afterCodeSetPassword ? { ...DEMO_PROFILE, email: authEmail } : { ...DEMO_PROFILE, email: authEmail, full_name: "", has_business: false, business_name: "", business_preset: "general", onboarded: false }; return continueSignIn(); }
    const { data, error } = await sb.auth.verifyOtp({ email: authEmail, token, type: "email" });
    if (error || !data?.session) { busy($("codeGo"), false, "Verify"); inp.value = ""; return authErr("That code isn't right, or it has expired. Check the latest email, or tap Resend for a new code."); }
    session = data.session;
    await continueSignIn();
  };
  const tick = () => {
    const b = $("resend"); if (!b) return clearInterval(resendTimer);
    const left = Math.ceil((resendAt - Date.now()) / 1000);
    b.disabled = left > 0; b.textContent = left > 0 ? `Resend email in ${left}s` : "Resend email";
  };
  clearInterval(resendTimer); resendTimer = setInterval(tick, 1000); tick();
  $("resend").onclick = async () => { const err = await sendCode(); authErr(err || ""); if (!err) toast("New code sent"); tick(); };
}

// ---- After sign-in: load profile, onboard if needed ---------------------------------
async function loadProfile() {
  if (demo) return profile;
  const { data, error } = await sb.from("profiles").select("*").eq("user_id", session.user.id).maybeSingle();
  if (error) throw error;
  profile = data || { user_id: session.user.id, email: session.user.email, has_business: false, business_preset: "general", onboarded: false };
  return profile;
}
async function afterSignIn() {
  try { await loadProfile(); } catch (e) { return showAuth(`<h2 class="step-h">Something went wrong</h2><p class="step-p">${esc(e.message || e)}</p><button class="btn primary big" onclick="location.reload()">Try again</button>`); }
  me = profile.email || session?.user?.email || "dashboard";
  if (!profile.onboarded) return screenName();
  enterApp();
}
function enterApp() {
  deepLink(); showApp(); load();
  if (usedCode) { usedCode = false; setTimeout(offerPassword, 1400); }
}
// Once, after a sign-in by email code: offer a password so next time is quicker. "Not now" never asks again.
function offerPassword() {
  const p = homePrefs();
  if (!profile || p.has_password || p.pw_offer_done || !$("app") || $("app").classList.contains("hidden") || $("sheetRoot").innerHTML) return;
  const close = sheet("pwo", "Sign in faster next time", `
    <p class="fine" style="margin-top:0">Add a password and you won't need to wait for an email code. You can still use a code whenever you like.</p>
    <form id="pwoForm" class="auth-form" style="margin-top:6px">
      <input type="email" autocomplete="username" value="${esc(profile?.email || session?.user?.email || "")}" hidden>
      <input id="pwoA" type="password" autocomplete="new-password" placeholder="New password (at least 8 characters)" minlength="8">
      <input id="pwoB" type="password" autocomplete="new-password" placeholder="Type it again">
      <button class="btn primary big" id="pwoSave" type="submit">Save password</button>
      <button class="btn big" id="pwoSkip" type="button">Not now</button>
    </form>
    <p class="fine">You can add one any time in Account → Sign-in &amp; security.</p>`, () => { if (!homePrefs().has_password && !homePrefs().pw_offer_done) saveProfile({ home_prefs: { ...homePrefs(), pw_offer_done: true } }); });
  setTimeout(() => $("pwoA") && $("pwoA").focus(), 60);
  $("pwoSkip").onclick = () => { saveProfile({ home_prefs: { ...homePrefs(), pw_offer_done: true } }); close(); };
  $("pwoForm").onsubmit = async (e) => {
    e.preventDefault();
    const a = $("pwoA").value, b = $("pwoB").value;
    if (a.length < 8) return toast("Use at least 8 characters");
    if (/^\d+$/.test(a) || /^(password|12345678|egom)/i.test(a)) return toast("Pick something harder to guess");
    if (a !== b) return toast("The two passwords don't match");
    $("pwoSave").disabled = true;
    if (!demo) {
      const { error } = await sb.auth.updateUser({ password: a });
      if (error) { $("pwoSave").disabled = false; return toast(/reauth|aal2|assurance/i.test(error.message) ? "Enter your two-step code first, then try again" : "Couldn't save: " + error.message); }
    }
    await saveProfile({ home_prefs: { ...homePrefs(), has_password: true, pw_offer_done: true } });
    close(); toast("Password saved. Next time, sign in with it.");
  };
}
// Links from notifications and the home-screen shortcut: /?tab=budget, /?add=1
function deepLink() {
  const q = new URLSearchParams(location.search);
  const t = q.get("tab");
  if (t && ["home", "accounts", "tx", "budget"].includes(t)) { tab = t; catSel = null; }
  if (q.get("add")) setTimeout(() => { try { openAdd(); } catch {} }, 600);
  if (t || q.get("add") || q.get("source")) history.replaceState(null, "", location.pathname);
}

async function saveProfile(patch) {
  Object.assign(profile, patch);
  if (demo) return null;
  const { error } = await sb.from("profiles").update({ ...patch, updated_at: new Date().toISOString() }).eq("user_id", profile.user_id);
  return error ? error.message : null;
}
const dots = (n) => `<div class="dots">${[1, 2, 3].map((i) => `<i class="${i <= n ? "on" : ""}"></i>`).join("")}</div>`;

// ---- 3. Onboarding: name --------------------------------------------------------------
function screenName() {
  showAuth(`${dots(1)}
    <h2 class="step-h">What name is on your bank account?</h2>
    <p class="step-p">Egom uses it to tell which receipts are yours. Type it the way your bank writes it.</p>
    <form id="nameForm" class="auth-form">
      <input id="nameIn" autocomplete="name" placeholder="e.g. Ada Obi" required value="${esc(profile.full_name || "")}">
      <button class="btn primary big" type="submit">Continue</button>
      <div id="authErr" class="auth-err hidden"></div>
    </form>`);
  $("nameIn").focus();
  $("nameForm").onsubmit = (e) => {
    e.preventDefault();
    const v = $("nameIn").value.replace(/\s+/g, " ").trim();
    if (v.split(" ").length < 2) return authErr("Add at least two names, the way they appear on your account.");
    onboardDraft.full_name = v; screenBusiness();
  };
}

// ---- 4. Onboarding: business --------------------------------------------------------
function screenBusiness() {
  // Nothing is picked until the person taps a card (unless they already finished onboarding before)
  const d = { has_business: onboardDraft.has_business ?? (profile.onboarded ? !!profile.has_business : null), business_name: onboardDraft.business_name ?? profile.business_name ?? "", business_preset: onboardDraft.business_preset ?? (profile.onboarded ? profile.business_preset : null) };
  showAuth(`<button class="linkbtn back" id="back">‹ Back</button>${dots(2)}
    <h2 class="step-h">Do you also run a business?</h2>
    <p class="step-p">Egom can keep business spending apart from personal spending.</p>
    <div class="choice">
      <button type="button" data-b="0" aria-pressed="${d.has_business === false}" class="${d.has_business === false ? "on" : ""}">${icon("person")}<b>Just me</b><small>Personal spending only</small></button>
      <button type="button" data-b="1" aria-pressed="${d.has_business === true}" class="${d.has_business === true ? "on" : ""}">${icon("briefcase")}<b>Me and my business</b><small>Two ledgers, kept apart</small></button>
    </div>
    <form id="bizForm" class="auth-form">
      <div id="bizFields" class="${d.has_business ? "" : "hidden"}">
        <label for="bizIn">Business name, as on its bank account</label>
        <input id="bizIn" placeholder="e.g. Ada Foods Ltd" value="${esc(d.business_name)}">
        <label>What kind of business is it?</label>
        <div class="kinds">${EX.BUSINESS_KINDS.map(([k, v]) => `<button type="button" data-p="${k}" aria-pressed="${d.business_preset === k}" class="${d.business_preset === k ? "on" : ""}">${v}</button>`).join("")}</div>
        <p class="fine">This picks the starting categories. You can change it later.</p>
      </div>
      <button class="btn primary big" type="submit" id="bizGo">Continue</button>
      <div id="authErr" class="auth-err hidden"></div>
    </form>`);
  $("back").onclick = screenName;
  document.querySelectorAll("[data-b]").forEach((b) => b.onclick = () => {
    d.has_business = b.dataset.b === "1";
    document.querySelectorAll("[data-b]").forEach((x) => { x.classList.toggle("on", x === b); x.setAttribute("aria-pressed", x === b); });
    $("authErr").classList.add("hidden");
    $("bizFields").classList.toggle("hidden", !d.has_business);
    if (d.has_business) $("bizIn").focus();
  });
  document.querySelectorAll("[data-p]").forEach((b) => b.onclick = () => { d.business_preset = b.dataset.p; document.querySelectorAll("[data-p]").forEach((x) => { x.classList.toggle("on", x === b); x.setAttribute("aria-pressed", x === b); }); });
  $("bizForm").onsubmit = async (e) => {
    e.preventDefault();
    d.business_name = $("bizIn").value.replace(/\s+/g, " ").trim();
    if (d.has_business === null) return authErr("Choose Just me, or Me and my business.");
    if (d.has_business && d.business_name.length < 2) return authErr("Add your business name.");
    if (d.has_business && !d.business_preset) return authErr("Pick the kind of business.");
    if (!d.has_business) d.business_preset = d.business_preset || "general";
    Object.assign(onboardDraft, d);
    busy($("bizGo"), true, "Saving…");
    const err = await saveProfile({ full_name: onboardDraft.full_name, has_business: d.has_business, business_name: d.has_business ? d.business_name : null, business_preset: d.business_preset });
    if (err) { busy($("bizGo"), false, "Continue"); return authErr("Couldn't save: " + err); }
    screenLink(true);
  };
}

// ---- 5. WhatsApp link (onboarding step 3, and from settings) ---------------------------
async function newLinkCode() {
  if (demo) return String(Math.floor(100000 + Math.random() * 900000));
  const { data, error } = await sb.rpc("create_link_code");
  if (error) throw error;
  return data;
}
function stopLinkPoll() { clearInterval(linkPoll); linkPoll = null; }
function startLinkPoll(onLinked) {
  stopLinkPoll();
  const started = Date.now();
  linkPoll = setInterval(async () => {
    if (Date.now() - started > 30 * 60 * 1000) return stopLinkPoll();
    if (demo) { if (Date.now() - started > 6000) { profile.whatsapp = "2348012345678"; stopLinkPoll(); onLinked(); } return; }
    const { data } = await sb.from("profiles").select("whatsapp").eq("user_id", profile.user_id).maybeSingle();
    if (data?.whatsapp) { profile.whatsapp = data.whatsapp; stopLinkPoll(); onLinked(); }
  }, 3000);
}
function linkBlock(code) {
  return `<div class="linkcard">
      <div class="lc-code">LINK ${code}</div>
      <a class="btn wa big" href="${waLink(code)}" target="_blank" rel="noopener">Open WhatsApp and send</a>
      <p class="fine">Or send <b>LINK ${code}</b> on WhatsApp to <b>${BOT_DISPLAY}</b> from the number you'll use. The code works for 30 minutes.</p>
      <div class="waiting"><span class="spin"></span>Waiting for your message…</div>
    </div>`;
}
async function screenLink(onboarding) {
  let code;
  try { code = await newLinkCode(); } catch (e) { code = null; }
  showAuth(`${onboarding ? `<button class="linkbtn back" id="back">‹ Back</button>${dots(3)}` : ""}
    <h2 class="step-h">Link your WhatsApp</h2>
    <p class="step-p">Then you can forward receipts to Egom and they'll land in your account.</p>
    ${code ? linkBlock(code) : `<div class="auth-err">Couldn't create a link code. You can do this later from your account.</div>`}
    <button class="btn big ghost" id="later">${onboarding ? "I'll do this later" : "Close"}</button>`);
  if ($("back")) $("back").onclick = () => { stopLinkPoll(); screenBusiness(); };
  const finish = async () => {
    stopLinkPoll();
    if (onboarding) { await saveProfile({ onboarded: true }); }
    enterApp();
  };
  $("later").onclick = finish;
  if (code) startLinkPoll(() => {
    $("authBody").querySelector(".linkcard").innerHTML = `<div class="linked">${icon("check")}<b>Linked</b><span>${esc(fmtPhone(profile.whatsapp))}</span></div><p class="fine">Forward a receipt to ${BOT_DISPLAY} to try it.</p>`;
    $("later").textContent = "Go to my dashboard"; $("later").classList.remove("ghost"); $("later").classList.add("primary");
  });
}

// A gentle reminder on the dashboard until WhatsApp is linked
function renderWaNudge() {
  const el = $("waNudge");
  if (!profile || profile.whatsapp) { el.classList.add("hidden"); return; }
  el.className = "wa-nudge";
  el.innerHTML = `${icon("chat")}<div><b>Link WhatsApp</b><small>Forward receipts straight to Egom.</small></div><button class="btn" id="nudgeGo">Link</button>`;
  $("nudgeGo").onclick = openLinkSheet;
}
async function openLinkSheet() {
  let code;
  try { code = await newLinkCode(); } catch (e) { return toast("Couldn't create a link code: " + (e.message || e)); }
  $("sheetRoot").innerHTML = `<div class="bg" id="lbg"><div class="sheet">
    <div style="display:flex;justify-content:space-between;align-items:center"><h4>Link your WhatsApp</h4><button class="btn" id="lx" aria-label="Close">${icon("close")}</button></div>
    <p class="step-p" style="margin-top:6px">Send this code from the WhatsApp number you'll forward receipts from.</p>
    ${linkBlock(code)}</div></div>`;
  const close = () => { stopLinkPoll(); $("sheetRoot").innerHTML = ""; };
  $("lx").onclick = close; $("lbg").onclick = (e) => { if (e.target.id === "lbg") close(); };
  startLinkPoll(() => {
    const c = document.querySelector("#sheetRoot .linkcard");
    if (c) c.innerHTML = `<div class="linked">${icon("check")}<b>Linked</b><span>${esc(fmtPhone(profile.whatsapp))}</span></div>`;
    renderWaNudge(); toast("WhatsApp linked");
    setTimeout(() => { if (document.querySelector("#sheetRoot .linkcard")) close(); }, 1800);
  });
}

// ---- 6. Settings ------------------------------------------------------------------------
function openSettings() {
  const d = { ...profile };
  $("sheetRoot").innerHTML = `<div class="bg" id="sbg"><div class="sheet">

async function start() {

  let createClient = null;
  if (live) { try { ({ createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm")); } catch {} }
  if (!createClient) {
    demo = true;

    return screenEmail();
  }
  sb = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, detectSessionInUrl: true } });
  // A customer opening an invoice or quote link: show just that document, no sign-in
  const docToken = new URLSearchParams(location.search).get("doc");

  if (data.session) { session = data.session; return continueSignIn(); }
  screenEmail();
}

  const c = ((homePrefs().cat_map || {})[x.space] || {})[c0] || c0;
  if (list.includes(c)) return c;
  return x.kind === "income" ? EX.incomeCategory(`${x.d.narration || ""} ${x.counterparty || ""}`, x.space) : "Other";
}
// One existing record can only "use up" one new entry, so two identical charges on a statement
// are only flagged if two matching records already exist.
function sameTx(a, b) {
  if (a.reference && b.reference && a.reference === b.reference) return true;
  if (Math.abs(Number(a.amount) - Number(b.amount)) > 1) return false;
  if ((a.kind === "income") !== (b.kind === "income")) return false;
  return Math.abs(new Date(a.date + "T12:00:00") - new Date(b.date + "T12:00:00")) <= 86400000 * 1.5;
}
function markDups() {
  const used = new Set();
  const existing = rows.map((r) => ({ r, k: { amount: r.amount, kind: r.kind, date: r.tx_date, reference: r.reference } }));
  drafts.forEach((x, i) => {
    const k = { amount: x.amount, kind: x.kind, date: x.date, reference: x.d.reference };
    let hit = existing.find((e) => !used.has(e.r) && sameTx(k, e.k));
    if (hit) { used.add(hit.r); x.dup = hit.r.counterparty || "an earlier entry"; }
    else if (draftSource !== "statement") {
      // Same screenshot picked twice
      const twin = drafts.slice(0, i).find((o) => sameTx(k, { amount: o.amount, kind: o.kind, date: o.date, reference: o.d.reference }));
      x.dup = twin ? "another image in this batch" : null;
    } else x.dup = null;
    if (x.dup && x._fresh) x.sel = false;
    delete x._fresh;
  });
}

function parseAmount(v) {
  const m = String(v || "").toLowerCase().replace(/[₦,\s]/g, "").match(/^(\d+(?:\.\d+)?)(k|m)?$/);

}

// The account holder's name sits near the top of a statement: whichever of your names appears first wins
function whoseStatement(head) {
  const t = EX.norm(head.slice(0, 2500));
  const firstHit = (words) => { const idx = words.map((w) => t.search(new RegExp(`(^|\\s)${w}(\\s|$)`))); return idx.every((i) => i >= 0) ? Math.max(...idx) : -1; };
  const pw = EX.norm(PN()).split(" ").filter((w) => w.length > 1);
  const bw = EX.norm(BN()).split(" ").filter((w) => w.length > 2 && !["ltd", "limited", "the", "and", "concept", "innovative", "nig", "nigeria", "services", "enterprises", "ventures"].includes(w));
  const pi = pw.length ? firstHit(pw) : -1, bi = bw.length ? firstHit(bw) : -1;
  if (pi < 0 && bi < 0) return null;
  if (bi < 0) return "personal"; if (pi < 0) return "business";
  return bi < pi ? "business" : "personal";
}

  // Read the first page top-to-bottom (PDF text order can differ from what you see), so the account name in the header comes first
  const head = res.pages[0] ? [...res.pages[0]].sort((a, b) => b.y - a.y || a.x - b.x).map((it) => it.str).join(" ") : res.text.slice(0, 3000);

}

async function saveDrafts() {
  const chosen = drafts.filter((x) => x.sel && x.amount > 0);
  if (!chosen.length) return;
  const batch = crypto.randomUUID ? crypto.randomUUID() : String(Date.now());
  const payload = chosen.map((x) => ({
    batch_id: batch, sender: me, source: draftSource, status: "saved", space: x.space, kind: x.kind,
    tx_date: x.date, tx_time: x.d.time || null, amount: x.amount, fee: x.d.fee || 0, currency: "NGN",
    counterparty: x.counterparty || null, narration: x.d.narration || null, reference: x.d.reference || null, bank: x.d.bank || null,
    category: x.category, category_personal: x.d.category_personal, category_business: x.d.category_business, confidence: x.d.confidence,
  }));
  $("rSave").disabled = true; $("rSave").textContent = "Saving…";
  if (demo) {
    payload.forEach((p, i) => rows.push({ ...p, id: "new" + Date.now() + i }));
    $("sheetRoot").innerHTML = ""; render(); return toast(`Preview only: ${payload.length} shown, not saved`);
  }
  const saved = [];
  for (let i = 0; i < payload.length; i += 200) {
    const { data, error } = await sb.from("expenses").insert(payload.slice(i, i + 200)).select();
    if (error) { $("rSave").disabled = false; $("rSave").textContent = "Try again"; return toast("Couldn't save: " + error.message); }
    saved.push(...(data || []));
  }
  // Remember categories you picked by hand for next time
  const learn = chosen.filter((x) => x._catTouched && normKey(x.counterparty).length >= 3);
  if (learn.length) {
    await sb.from("category_rules").upsert(learn.map((x) => ({ space: x.space, counterparty_key: normKey(x.counterparty), category: x.category, updated_at: new Date().toISOString() })));
    learn.forEach((x) => { if (rulesCache) rulesCache[x.space + "|" + normKey(x.counterparty)] = x.category; });
  }
  rows.push(...saved); $("sheetRoot").innerHTML = ""; drafts = [];
  const months = [...new Set(saved.map((r) => (r.tx_date || "").slice(0, 7)))];
  if (months.length === 1 && months[0] !== ym) ym = months[0];
  render(); toast(`Added ${saved.length} transaction${saved.length > 1 ? "s" : ""}`);
}
